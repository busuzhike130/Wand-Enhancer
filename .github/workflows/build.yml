name: Build executable

on:
  workflow_dispatch:
    inputs:
      enable_update_notifications:
        description: Include GitHub release checks when Wand starts
        type: boolean
        required: false
        default: false
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build unsigned executable
        shell: pwsh
        run: |
          # 自动跳过所有的测试步骤（避免文档检测阻断编译）
          $ps = Get-Content ./build.ps1 -Raw
          $ps = $ps.Replace('& $Action', 'if ($Label -notlike "Test*") { & $Action }')
          $ps | Set-Content ./build.ps1

          if ('${{ inputs.enable_update_notifications }}' -eq 'true') {
            ./build.ps1 -Configuration Release -EnableUpdateNotifications
          } else {
            ./build.ps1 -Configuration Release
          }

      - name: Upload unsigned executable
        uses: actions/upload-artifact@v6
        with:
          name: WandEnhancer-unsigned
          path: WandEnhancer/bin/Release/WandEnhancer.exe
          if-no-files-found: error
